name: Publish Docker image

on:
  # `published` alone, NOT [published, prereleased]: GitHub emits `published` for prereleases too,
  # so listing both fired this workflow twice for every beta -- two concurrent jobs building and
  # pushing the same image tags, racing each other at the registry for no benefit.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to build and publish"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme (comments kept out of the `tags:` block scalar below, where they would be
      # literal input rather than YAML comments):
      #   <version>  every release, for pinning        e.g. 1.0.0-beta5
      #   latest     newest STABLE release only        -- was applied unconditionally, so every
      #              beta and every manual dispatch moved it, which made it useless as a
      #              stability signal
      #   beta       newest prerelease                 -- the moving tag for beta deploys, now
      #              that `latest` deliberately no longer moves for them
      #   sha-<sha>  every build, for exact traceability
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease == true }}
            type=sha,format=short
            type=raw,value=${{ github.event.inputs.ref }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
