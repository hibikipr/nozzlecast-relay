services:
  nozzlecast-relay:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NTFY_SERVER: "https://ntfy.townsville.cc"
      NTFY_TOPIC: "townsville-3dprinter"
      NTFY_AUTH_TOKEN: "${NTFY_AUTH_TOKEN}"
      RELAY_AUTH_SECRET: "${RELAY_AUTH_SECRET}"
      APNS_KEY_PATH: "/secrets/AuthKey.p8"
      APNS_KEY_ID: "${APNS_KEY_ID}"
      APNS_SANDBOX_KEY_PATH: "/secrets/AuthKey-Sandbox.p8"
      APNS_SANDBOX_KEY_ID: "${APNS_SANDBOX_KEY_ID}"
      APNS_TEAM_ID: "89863526TH"
      APNS_BUNDLE_ID: "com.victormanuel.NozzleCast"
      BAMBUDDY_URL: "https://your-bambuddy-instance.example.com"
      BAMBUDDY_API_KEY: "${BAMBUDDY_API_KEY}"
    volumes:
      - ./data:/data
      - ./secrets/AuthKey.p8:/secrets/AuthKey.p8:ro
      - ./secrets/AuthKey-Sandbox.p8:/secrets/AuthKey-Sandbox.p8:ro
